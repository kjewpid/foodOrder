spring.application.name=api-gateway
server.port=80

eureka.client.service-url.defaultZone=http://eureka-server:8010/eureka/
spring.cloud.gateway.server.webflux.x-forwarded.enabled=true

# Frontend
spring.cloud.gateway.server.webflux.routes[0].id=frontend
spring.cloud.gateway.server.webflux.routes[0].uri=lb://frontend
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/,/home,/login,/register,/logout,/profile,/profile/**,/admin/**,/css/**

# User-service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

# Stng av automatiska routes
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

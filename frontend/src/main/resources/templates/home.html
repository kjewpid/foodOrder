<!DOCTYPE html>
<html lang="sv"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>FoodOrder - Hem</title>
</head>
<body>

<h1>Välkommen till FoodOrder!</h1>

<div th:if="${loggedIn}">
    <h2>Du är inloggad!</h2>
    <a th:href="@{/profile}">Min profil</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logga ut</button>
    </form>
</div>

<div th:unless="${loggedIn}">
    <h2>Du är utloggad.</h2>
    <a th:href="@{/login}">Logga in</a>
    <a th:href="@{/register}">Registrera konto</a>
</div>

</body>
</html>

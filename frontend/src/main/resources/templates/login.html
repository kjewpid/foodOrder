<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>FoodOrder - Logga in</title>
</head>
<body>

<h1>Välkommen till FoodOrder!</h1>
<h2>Logga in</h2>

<p th:if="${param.error}">
    Fel e-post eller lösenord.
</p>

<p th:if="${param.registered}">
    Ditt konto har skapats! Logga in.
</p>

<form th:action="@{/login}" method="post">

    <label for="username">E-post:</label>
    <input type="email" id="username"
           name="username" required>

    <br><br>

    <label for="password">Lösenord:</label>
    <input type="password" id="password"
           name="password" required>

    <br><br>

    <button type="submit">Logga in</button>

</form>

<br>
<div>
    <a th:href="@{/register}">Registrera nytt konto</a>
</div>

</body>
</html>

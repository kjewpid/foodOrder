
services:
  user-db:
    image: mysql:8.4
    container_name: foodorder-user-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: foodorder_users
    volumes:
      - user-db-data:/var/lib/mysql

  user-service:
    build:
      context: ./user-service
    container_name: foodorder-user-service
    depends_on:
      - user-db

  eureka-server:
    build:
      context: ./discovery-server
    container_name: foodorder-eureka-server
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./frontend
    container_name: foodorder-frontend
    ports:
      - "80:8080"

  activemq:
    image: apache/activemq-artemis:latest
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    volumes:
      - activemq-data:/var/lib/artemis-instance

volumes:
  user-db-data:
  activemq-data:
